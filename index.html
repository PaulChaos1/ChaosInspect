<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHAOS Inspect">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>CHAOS Inspect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-thumb field app. Sticky black header, full-width list rows, big Pass/Fail/N/A targets, bottom sheet for tickets so the checklist never unmounts. */
:root{
  --bg:#ffffff; --surface:#f3f3f2; --ink:#0b0b0b; --muted:#5f5f5c; --line:#dcdcd9;
  --bar:#0b0b0b; --barfg:#ffffff;
  --pass:#17803d; --fail:#c8231a; --warn:#b26a00; --na:#6d6d69; --onfill:#ffffff;
  --lgB:block; --lgW:none;
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --surface:#171716; --ink:#f4f4f2; --muted:#a3a39f; --line:#2c2c2a;
  --bar:#000000; --barfg:#ffffff; --pass:#3ecf74; --fail:#ff5a4f; --warn:#f0a43a; --na:#8d8d88; --onfill:#0b0b0b;
  --lgB:none; --lgW:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#171716; --ink:#f4f4f2; --muted:#a3a39f; --line:#2c2c2a;
  --bar:#000000; --barfg:#ffffff; --pass:#3ecf74; --fail:#ff5a4f; --warn:#f0a43a; --na:#8d8d88; --onfill:#0b0b0b;
  --lgB:none; --lgW:block; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--barfg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:40px}
.logo{height:18px;width:auto}
.top .logo{display:block}
.lgB{display:var(--lgB)}.lgW{display:var(--lgW)}
.top .lgB{display:none}.top .lgW{display:block}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid currentColor;border-radius:99px;padding:6px 12px;font:600 12px/1 var(--body);letter-spacing:.02em;min-height:32px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ecf74}
.off .dot{background:#f0a43a}
.iconbtn{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:8px;font:700 22px/1 var(--display)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;font-weight:800;text-transform:uppercase}
h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* home */
.hero{padding:24px 0 8px;display:grid;gap:6px}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);padding:12px 14px;font:500 16px var(--body);appearance:none;-webkit-appearance:none}
textarea.inp{min-height:96px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px;gap:10px}
.tpl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:16px 0;border-top:1px solid var(--line);align-items:center;min-height:76px}
.tpl:last-child{border-bottom:1px solid var(--line)}
.tpl b{font:700 19px/1.15 var(--display)}
.tpl .arrow{grid-row:1/3;grid-column:2;font:700 24px var(--display)}
.tag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:4px 7px;color:var(--muted)}
.tag.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.resume{background:var(--ink);color:var(--bg);padding:16px;display:grid;gap:10px;margin-top:20px}
.resume .btn{background:var(--bg);color:var(--ink)}
.btn{min-height:56px;padding:0 20px;font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:44px;width:auto;font-size:13px;padding:0 14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* run */
.prog{height:6px;background:var(--line);margin-top:0}
.prog i{display:block;height:100%;background:var(--ink);transition:width .2s}
.runhead{padding:14px 0 10px;display:grid;gap:8px}
.counts{display:flex;gap:16px;font:600 13px var(--body)}
.counts span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;display:inline-block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--bg);z-index:40}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:1.5px solid var(--ink);font:600 13px var(--body);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip.done{background:var(--ink);color:var(--bg)}
.group{scroll-margin-top:130px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:20px 0 8px;border-bottom:3px solid var(--ink)}
.group-h h3{font-size:20px;font-weight:800;text-transform:uppercase}
.item{padding:14px 0 14px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px;border-left:6px solid transparent;margin-left:-12px;scroll-margin-top:150px}
.item.f{border-left-color:var(--fail)}.item.p{border-left-color:var(--pass)}.item.n{border-left-color:var(--na)}
.item .q{font:500 17px/1.3 var(--body)}
.item .ref{font:400 11px var(--mono);color:var(--muted);margin-top:3px;display:block}
.res{display:grid;grid-template-columns:1fr 1fr 0.7fr;gap:8px}
.rb{min-height:56px;border:2px solid var(--ink);font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;display:grid;place-items:center}
.rb:active{transform:scale(.97)}
.rb.on.p{background:var(--pass);border-color:var(--pass);color:var(--onfill)}
.rb.on.f{background:var(--fail);border-color:var(--fail);color:var(--onfill)}
.rb.on.n{background:var(--na);border-color:var(--na);color:var(--onfill)}
.fd{background:var(--surface);padding:12px;display:grid;gap:8px;border-left:3px solid var(--fail);margin-left:0}
.fd .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sev{font:700 12px/1 var(--mono);padding:5px 8px;background:var(--fail);color:var(--onfill)}
.sev.s3{background:var(--warn)}.sev.s4{background:var(--na)}
.tk{font:500 13px var(--mono);border:1.5px solid var(--ink);padding:5px 8px;display:inline-flex;gap:6px;align-items:center}
.tk.q{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line)}
.lnk{font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;padding:0 2px}
.restpass{margin:10px 0 0;display:flex;justify-content:flex-end}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg);border-top:2px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--bg);color:var(--ink);max-height:94%;overflow:auto;box-shadow:var(--sheet-shadow);animation:up .2s ease-out;border-top:4px solid var(--fail);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:560px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:4px}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;display:flex;gap:12px;align-items:flex-start;z-index:2;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px;line-height:1.2;font-weight:700;flex:1}
.sevs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sv{border:2px solid var(--ink);padding:10px 4px;text-align:center;display:grid;gap:3px;min-height:64px;align-content:center}
.sv b{font:800 18px var(--mono)}.sv span{font:500 11px/1.2 var(--body);color:var(--muted)}
.sv.on{background:var(--ink);color:var(--bg)}.sv.on span{color:inherit;opacity:.85}
.qp{display:flex;gap:8px;flex-wrap:wrap}
.qp button{min-height:40px;padding:0 12px;border:1.5px solid var(--ink);font:600 14px var(--body)}
.qp button.on{background:var(--ink);color:var(--bg)}
.addph{min-height:56px;width:56px;border:2px dashed var(--ink);display:grid;place-items:center;font:700 22px var(--display);cursor:pointer}
.phrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phrow .ph{position:relative}
.phrow .ph img{width:56px;height:56px;object-fit:cover;display:block}
.phrow .ph button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px;line-height:1}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 0;border-top:1px solid var(--line);margin-top:8px}
.sw2{width:56px;height:32px;background:var(--line);border-radius:99px;position:relative;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:transform .15s}
.sw2.on{background:var(--ink)}.sw2.on::after{transform:translateX(24px)}
.dup{background:var(--surface);border-left:4px solid var(--warn);padding:12px;display:grid;gap:8px;font-size:14px}
pre.json{background:var(--surface);padding:12px;margin:0;font:400 12px/1.5 var(--mono);overflow-x:auto;white-space:pre;border:1px solid var(--line)}
details summary{min-height:44px;display:flex;align-items:center;font:600 14px var(--body);cursor:pointer}
.banner{padding:10px 12px;font:600 14px var(--body);background:var(--warn);color:#fff}
.banner.k{background:var(--fail)}
:root[data-theme="dark"] .banner,:root:not([data-theme="light"]) .banner{color:#0b0b0b}
/* summary */
.score{display:flex;align-items:flex-end;gap:14px;padding:22px 0 6px}
.score>b{font:800 72px/0.9 var(--display);letter-spacing:-.03em}
.bars{display:grid;gap:12px;margin-top:8px}
.bar{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}
.bar .t{font:600 14px var(--body)}.bar .v{font:500 13px var(--mono)}
.bar .track{grid-column:1/3;height:12px;background:var(--line);display:flex}
.bar .track i{display:block;height:100%}
.bar .track .gp{background:var(--pass)}.bar .track .gf{background:var(--fail)}.bar .track .gn{background:var(--na);opacity:.5}
.frow{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;font:600 14px var(--body);z-index:90;max-width:calc(100% - 32px);text-align:center}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:center}
.hrow .sc{grid-row:1/3;font:800 26px var(--display);min-width:64px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>

<div id="layer"></div>
<div id="toast" hidden class="toast" role="status"></div>

 fails.sort(function(a,b){return a.r.sev-b.r.sev});
 var fl=fails.map(function(f){return '<div class="frow"><div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sev s'+f.r.sev+'">'+SEV[f.r.sev].n+'</span>'+(f.r.ticket?'<span class="tk">'+esc(f.r.ticket)+'</span>':(f.r.q?'<span class="tk q">Queued</span>':'<span class="tag">No ticket</span>'))+'<span class="small muted">'+esc(f.sec.t)+'</span></div><div>'+esc(f.it.t)+'</div>'+(f.r.note?'<div class="small muted">'+esc(f.r.note)+'</div>':'')+(!ro&&!f.r.ticket&&!f.r.q?'<button class="lnk" data-a="edit2" data-i="'+f.it.id+'">Create ticket</button>':'')+'</div>'}).join('');
 var noTix=fails.filter(function(f){return !f.r.ticket&&!f.r.q}).length;
 return header(ro?'<button class="iconbtn" data-a="hist" aria-label="Back" style="margin-left:-10px">←</button>':'<button class="iconbtn" data-a="back" aria-label="Back to checklist" style="margin-left:-10px">←</button>',net(),'')
 +'<div class="wrap"><div class="runhead"><h2>'+(ro?'Completed inspection':'Review')+'</h2><h1 style="font-size:24px">'+esc(t.name)+'</h1><div class="small muted">'+esc(d.site)+' · '+esc(d.by||st.inspector||'')+(ro?' · '+fmt(d.at):'')+'</div></div>'
 +'<div class="score"><b>'+s.score+'%</b><div class="small muted" style="padding-bottom:6px">'+s.p+' pass · '+s.f+' fail · '+s.n+' n/a'+(s.u?' · <span style="color:var(--fail);font-weight:700">'+s.u+' unanswered</span>':'')+'</div></div>'
 +'<div class="sec-h"><h2>Breakdown by area</h2><span class="small muted">pass / fail / n/a</span></div><div class="bars">'+bars+'</div>'
 +'<div class="sec-h"><h2>Failed items · '+fails.length+'</h2></div>'+(fl||'<p class="muted">No fails. Nothing to fix.</p>')
 +(ro?'':'<div class="dock"><div class="in">'+(s.u?'<button class="btn ghost" data-a="naRest">Mark '+s.u+' left as N/A</button><button class="btn" data-a="back">Finish checklist</button>':'<button class="btn ghost" style="width:36%" data-a="copy">Copy</button><button class="btn" data-a="submit">'+(noTix?'Submit ('+noTix+' without ticket)':'Submit inspection')+'</button>')+'</div></div>')+'</div>'}
function vView(){var h=st.history.filter(function(x){return x.id===cur})[0];if(!h){return vHist()}
 var secs=h.secs.map(function(x){return '<div class="bar"><span class="t">'+esc(x[0])+'</span><span class="v">'+x[1]+'%</span><div class="track" aria-hidden="true"><i class="gp" style="width:'+x[1]+'%"></i><i class="gf" style="width:'+(100-x[1])+'%"></i></div></div>'}).join('');
 return header('<button class="iconbtn" data-a="hist" aria-label="Back" style="margin-left:-10px">←</button>',net(),'')+'<div class="wrap"><div class="runhead"><h2>Completed inspection'+(h.ex?' · example':'')+'</h2><h1 style="font-size:24px">'+esc(tpl(h.tid).name)+'</h1><div class="small muted">'+esc(h.site)+' · '+esc(h.by)+' · '+fmt(h.at)+'</div></div><div class="score"><b>'+h.score+'%</b><div class="small muted" style="padding-bottom:6px">'+h.pass+' pass · '+h.fail+' fail · '+h.na+' n/a</div></div><div class="sec-h"><h2>Breakdown by area</h2></div><div class="bars">'+secs+'</div><div class="sec-h"><h2>Tickets</h2></div>'+(h.tickets.length?h.tickets.map(function(k){return '<span class="tk" style="margin-right:6px">'+esc(k)+'</span>'}).join(''):'<p class="muted">None raised.</p>')+'</div>'}
function vHist(){var rows=st.history.filter(function(h){return h.site===st.site}).map(function(h){return '<button class="hrow" data-a="view" data-id="'+h.id+'"><span class="sc">'+h.score+'%</span><b style="font:700 16px var(--display)">'+esc(tpl(h.tid).name)+'</b><span class="small muted">'+fmt(h.at)+(h.ex?' · example':'')+'</span><span class="small muted" style="grid-column:2/4">'+h.fail+' fail · '+h.tickets.length+' ticket'+(h.tickets.length===1?'':'s')+' · '+esc(h.by)+'</span></button>'}).join('');
 var tix=st.tickets.filter(function(t){return t.site===st.site}).slice(0,12).map(function(t){return '<div class="frow"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tk'+(t.queued?' q':'')+'">'+esc(t.key)+'</span><span class="sev s'+t.sev+'">'+SEV[t.sev].n+'</span><span class="tag'+(t.status==='Done'?'':' dark')+'">'+(t.queued?'Queued':esc(t.status))+'</span>'+(t.ex?'<span class="tag">Example</span>':'')+'</div><div>'+esc(t.item)+'</div><div class="small muted">'+esc(t.trade)+' · '+fmt(t.created)+'</div></div>'}).join('');
 return header('<button class="iconbtn" data-a="home" aria-label="Back to home" style="margin-left:-10px">←</button>',net(),st.site)+'<div class="wrap"><div class="hero" style="padding-bottom:0"><h1>History</h1></div><div class="sec-h"><h2>Inspections</h2></div>'+(rows||'<p class="muted">Nothing yet at this site.</p>')+'<div class="sec-h"><h2>Tickets raised from inspections</h2></div>'+(tix||'<p class="muted">No tickets.</p>')+'</div>'}

/* events */
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,d=cur&&st.drafts[cur];
 if(a==='close'){closeSheet();return}
 if(a==='net'){st.sim=!st.sim;save();render();if(online())flush();else toast('Offline test on. Tickets will queue');return}
 if(a==='open'){var tid=b.dataset.t,k=dkey(tid);if(!st.drafts[k])st.drafts[k]={tid:tid,site:st.site,start:Date.now(),items:{}};cur=k;save();go('run');return}
 if(a==='home'){save();cur=null;go('home');return}
 if(a==='hist'){go('history');return}if(a==='tix'){go('history');return}
 if(a==='view'){cur=b.dataset.id;go('view');return}
 if(a==='back'){go('run');return}
 if(a==='jump'){var g=document.getElementById('g-'+b.dataset.s);g&&g.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(a==='set'){var iid=b.dataset.i,v=b.dataset.v,t=tpl(d.tid),r=d.items[iid]||{};
  if(v==='f'){if(!r.r||r.r!=='f'){r.r='f';var info=itemInfo(t,iid);r.sev=r.sev||info.it.s;r.trade=r.trade||info.it.tr;d.items[iid]=r;save()}openSheet(iid);rerun();return}
  if(r.r==='f'&&(r.ticket||r.q)&&v!=='f'){toast('This fail has a ticket. Edit it or leave as fail.');return}
  r.r=(r.r===v)?null:v;if(r.r!=='f'){r.note='';r.photos=[]}d.items[iid]=r;save();rerun();buzz();
  if(r.r){var nx=nextUn(t,d,iid);if(nx)setTimeout(function(){var el=document.getElementById('i-'+nx);el&&el.scrollIntoView({block:'center',behavior:'smooth'})},180)}return}
 if(a==='edit'){openSheet(b.dataset.i);return}
 if(a==='edit2'){go('run');openSheet(b.dataset.i);return}
 if(a==='restpass'){var t2=tpl(d.tid),sc=t2.sections.filter(function(s){return s.id===b.dataset.s})[0];sc.items.forEach(function(it){if(!(d.items[it.id]&&d.items[it.id].r))d.items[it.id]={r:'p'}});save();rerun();buzz();return}
 if(a==='finish'){go('summary');return}
 if(a==='naRest'){var t3=tpl(d.tid);t3.sections.forEach(function(s){s.items.forEach(function(it){if(!(d.items[it.id]&&d.items[it.id].r))d.items[it.id]={r:'n'}})});save();render();return}
 if(a==='copy'){var t4=tpl(d.tid),s4=stats(t4,d);var txt=t4.name+' · '+d.site+' · '+s4.score+'%\n'+s4.secs.map(function(x){return x.s.t+': '+(x.score===null?'n/a':x.score+'%')}).join('\n');try{navigator.clipboard.writeText(txt).then(function(){toast('Summary copied')},function(){toast('Copy not allowed here')})}catch(er){toast('Copy not allowed here')}return}
 if(a==='submit'){if(!st.inspector.trim()){toast('Add your name on the home screen first');return}
  var t5=tpl(d.tid),s5=stats(t5,d),tk=[];t5.sections.forEach(function(sc){sc.items.forEach(function(it){var r=d.items[it.id];if(r&&(r.ticket||r.q))tk.push(r.ticket||r.q)})});
  st.history.unshift({id:'h'+Date.now(),tid:d.tid,site:d.site,by:st.inspector,at:Date.now(),score:s5.score,pass:s5.p,fail:s5.f,na:s5.n,tickets:tk,secs:s5.secs.map(function(x){return [x.s.t,x.score===null?100:x.score]})});
  delete st.drafts[cur];cur=null;save();toast('Inspection submitted · '+s5.score+'%');go('history');return}
 /* sheet actions */
 if(!sh)return;
 if(a==='sev'){readNote();sh.sev=+b.dataset.n;drawSheet();return}
 if(a==='phr'){readNote();var p=b.dataset.p,i=sh.phr.indexOf(p);if(i>-1)sh.phr.splice(i,1);else sh.phr.push(p);drawSheet();return}
 if(a==='mk'){readNote();sh.make=!sh.make;drawSheet();return}
 if(a==='rmph'){readNote();sh.photos.splice(+b.dataset.n,1);drawSheet();return}
 if(a==='attach'){readNote();sh.existing=b.dataset.k;sh.make=false;drawSheet();return}
 if(a==='savesheet'){commitSheet();return}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='site'){st.site=t.value;save();render()}
 if(t.id==='sh-file'&&sh){readNote();var fs=[].slice.call(t.files).slice(0,4-sh.photos.length),n=fs.length;if(!n)return;fs.forEach(function(f){compress(f,function(u){sh.photos.push(u);if(--n===0)drawSheet()})})}
});
document.addEventListener('input',function(e){if(e.target.id==='who'){st.inspector=e.target.value;save()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sh)closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='mk'){e.preventDefault();e.target.click()}});
window.addEventListener('online',function(){if(online())flush();render()});
window.addEventListener('offline',function(){render()});
load();seed();save();
var h0=(location.hash||'').replace('#','');if(h0==='history')route='history';render();
})();
</script>
